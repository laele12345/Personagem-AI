<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Personagem AI</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:
        radial-gradient(circle at top,#31206b 0%,transparent 35%),
        linear-gradient(135deg,#050711,#0d1020 50%,#17102d);
    color:white;
    min-height:100vh;
}

header{
    text-align:center;
    padding:55px 20px 45px;
    background:rgba(8,10,22,.75);
    border-bottom:1px solid #332b55;
    backdrop-filter:blur(10px);
}

header h1{
    margin:0;
    font-size:48px;
    color:#c4b5fd;
    text-shadow:0 0 25px #8b5cf688;
}

header p{
    color:#a5a8b8;
    font-size:17px;
}

.container{
    max-width:1050px;
    margin:auto;
    padding:30px 20px;
}

.card{
    background:rgba(21,25,43,.88);
    border:1px solid #343b61;
    border-radius:22px;
    padding:28px;
    margin-bottom:22px;
    box-shadow:0 15px 45px #0007;
    backdrop-filter:blur(12px);
}

.card h2{
    margin-top:0;
    color:#ddd6fe;
}

.grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:18px;
}

label{
    font-weight:bold;
    display:block;
    margin-bottom:8px;
    color:#d1d5db;
}

input,select{
    width:100%;
    padding:14px;
    border-radius:12px;
    border:1px solid #41496e;
    background:#0b1020;
    color:white;
    outline:none;
    transition:.2s;
}

input:focus,select:focus{
    border-color:#8b5cf6;
    box-shadow:0 0 0 3px #8b5cf622;
}

button{
    border:0;
    border-radius:12px;
    padding:13px 18px;
    background:#303852;
    color:white;
    font-weight:bold;
    cursor:pointer;
    transition:.2s;
}

button:hover{
    transform:translateY(-2px);
    filter:brightness(1.15);
}

.generate{
    width:100%;
    margin-top:24px;
    padding:17px;
    font-size:18px;
    background:linear-gradient(135deg,#7c3aed,#9333ea);
    box-shadow:0 8px 25px #7c3aed44;
}

.resultado{
    white-space:pre-wrap;
    line-height:1.75;
    min-height:300px;
    color:#e5e7eb;
    background:#0b1020;
    border:1px solid #303754;
    border-radius:15px;
    padding:20px;
}

.botoes{
    display:flex;
    gap:12px;
    margin-top:18px;
}

.botoes button{
    flex:1;
}

.personagem{
    background:linear-gradient(135deg,#20263a,#181c2d);
    border:1px solid #343b5d;
    border-radius:14px;
    padding:17px;
    margin-top:12px;
}

.personagem strong{
    color:#c4b5fd;
    font-size:17px;
}

.apagar{
    background:#991b1b;
    margin-left:7px;
}

.vazio{
    color:#9298aa;
    text-align:center;
    padding:20px;
}

footer{
    text-align:center;
    padding:35px;
    color:#71778b;
}

@media(max-width:650px){

    header h1{
        font-size:36px;
    }

    .grid{
        grid-template-columns:1fr;
    }

    .botoes{
        flex-direction:column;
    }

    .card{
        padding:20px;
    }
}
</style>
</head>

<body>

<header>
    <h1>✨ Personagem AI</h1>
    <p>Crie personagens únicos gratuitamente</p>
</header>

<div class="container">

<div class="card">

<h2>🧙 Criador avançado</h2>

<div class="grid">

<div>
<label>Nome</label>
<input id="nome" placeholder="Ex: Kael">
</div>

<div>
<label>Idade</label>
<input id="idade" type="number" placeholder="Ex: 18">
</div>

<div>
<label>Universo</label>
<select id="universo">
<option>Anime</option>
<option>Fantasia</option>
<option>Super-herói</option>
<option>Ficção científica</option>
<option>Medieval</option>
<option>Terror</option>
</select>
</div>

<div>
<label>Personalidade</label>
<select id="personalidade">
<option>Inocente</option>
<option>Corajoso</option>
<option>Frio</option>
<option>Engraçado</option>
<option>Misterioso</option>
<option>Inteligente</option>
<option>Impulsivo</option>
<option>Calmo</option>
</select>
</div>

<div>
<label>Aparência</label>
<select id="aparencia">
<option>Cabelos pretos e olhos intensos</option>
<option>Cabelos brancos e olhos claros</option>
<option>Cabelos vermelhos e olhar determinado</option>
<option>Cabelos azuis e aparência elegante</option>
<option>Cabelos longos e aparência misteriosa</option>
<option>Aparência selvagem e intimidadora</option>
</select>
</div>

<div>
<label>Estilo de luta</label>
<select id="luta">
<option>Artes marciais</option>
<option>Espadachim</option>
<option>Boxe</option>
<option>Jiu-Jitsu</option>
<option>Combate acrobático</option>
<option>Combate à distância</option>
</select>
</div>

<div>
<label>Roupa</label>
<select id="roupa">
<option>Casaco preto</option>
<option>Armadura futurista</option>
<option>Uniforme de guerreiro</option>
<option>Roupas medievais</option>
<option>Traje de herói</option>
<option>Roupa simples e elegante</option>
</select>
</div>

<div>
<label>Alinhamento</label>
<select id="alinhamento">
<option>Herói</option>
<option>Anti-herói</option>
<option>Vilão</option>
<option>Neutro</option>
<option>Protetor</option>
</select>
</div>

<div>
<label>Origem</label>
<select id="origem">
<option>Uma pequena vila</option>
<option>Uma cidade futurista</option>
<option>Um reino destruído</option>
<option>Uma organização secreta</option>
<option>Outro planeta</option>
<option>Uma família lendária</option>
</select>
</div>

<div>
<label>Objetivo</label>
<select id="objetivo">
<option>Proteger sua família</option>
<option>Ficar mais forte</option>
<option>Descobrir seu passado</option>
<option>Derrotar seu maior inimigo</option>
<option>Salvar seu mundo</option>
<option>Encontrar seu verdadeiro destino</option>
</select>
</div>

</div>

<button class="generate" onclick="gerar()">
✨ GERAR PERSONAGEM
</button>

</div>

<div class="card">

<h2>📖 Personagem criado</h2>

<div id="resultado" class="resultado">
Seu personagem aparecerá aqui.
</div>

<div class="botoes">

<button onclick="copiar()">📋 Copiar</button>

<button onclick="salvar()">💾 Salvar</button>

<button onclick="gerarAleatorio()">🎲 Aleatório</button>

</div>

</div>

<div class="card">

<h2>💾 Personagens salvos</h2>

<div id="salvos">
<p class="vazio">Nenhum personagem salvo.</p>
</div>

</div>

</div>

<footer>
Personagem AI • Projeto gratuito
</footer>

<script>

let atual="";

function gerar(){

let nome=document.getElementById("nome").value.trim();
let idade=document.getElementById("idade").value;
let universo=document.getElementById("universo").value;
let personalidade=document.getElementById("personalidade").value;
let aparencia=document.getElementById("aparencia").value;
let luta=document.getElementById("luta").value;
let roupa=document.getElementById("roupa").value;
let alinhamento=document.getElementById("alinhamento").value;
let origem=document.getElementById("origem").value;
let objetivo=document.getElementById("objetivo").value;

if(!nome) nome="Personagem";
if(!idade) idade="18";

let poderes=[
"controle de fogo",
"controle de gelo",
"manipulação de sombras",
"telecinese",
"super velocidade",
"força sobrenatural",
"regeneração",
"controle de eletricidade",
"manipulação de energia",
"teletransporte",
"controle da natureza",
"manipulação da gravidade"
];

let poder=poderes[Math.floor(Math.random()*poderes.length)];

atual=
`━━━━━━━━━━━━━━━━━━━━
✨ PERSONAGEM
━━━━━━━━━━━━━━━━━━━━

NOME
${nome}

IDADE
${idade} anos

UNIVERSO
${universo}

ALINHAMENTO
${alinhamento}

PERSONALIDADE
${personalidade}

APARÊNCIA
${aparencia}

ROUPA
${roupa}

ESTILO DE LUTA
${luta}

PODER PRINCIPAL
${poder}

ORIGEM
${origem}

OBJETIVO
${objetivo}

📖 HISTÓRIA

${nome} nasceu em ${origem}.

Desde cedo, sua personalidade
${personalidade.toLowerCase()}
o tornou diferente das outras pessoas.

Com o passar dos anos,
descobriu que possuía o poder de
${poder}.

Agora, como ${alinhamento.toLowerCase()},
precisa enfrentar os desafios de
${universo} enquanto tenta
${objetivo.toLowerCase()}.

Seu estilo de combate é baseado em
${luta}.

━━━━━━━━━━━━━━━━━━━━
PERSONAGEM AI
━━━━━━━━━━━━━━━━━━━━`;

document.getElementById("resultado").textContent=atual;
}

function copiar(){

if(!atual){
alert("Crie um personagem primeiro!");
return;
}

navigator.clipboard.writeText(atual);
alert("Personagem copiado!");
}

function salvar(){

if(!atual){
alert("Crie um personagem primeiro!");
return;
}

let lista=JSON.parse(localStorage.getItem("personagens")||"[]");

lista.unshift(atual);

localStorage.setItem("personagens",JSON.stringify(lista));

mostrarSalvos();

alert("Personagem salvo!");
}

function mostrarSalvos(){

let lista=JSON.parse(localStorage.getItem("personagens")||"[]");

let area=document.getElementById("salvos");

if(lista.length===0){
area.innerHTML='<p class="vazio">Nenhum personagem salvo.</p>';
return;
}

area.innerHTML="";

lista.forEach((personagem,index)=>{

let div=document.createElement("div");

div.className="personagem";

let nome=personagem.split("\n")[4];

div.innerHTML=
`<strong>${nome || "Personagem"}</strong>
<br><br>

<button onclick="abrir(${index})">
👁️ Abrir
</button>

<button class="apagar" onclick="apagar(${index})">
🗑️ Apagar
</button>`;

area.appendChild(div);

});
}

function abrir(index){

let lista=JSON.parse(localStorage.getItem("personagens")||"[]");

atual=lista[index];

document.getElementById("resultado").textContent=atual;

window.scrollTo({
top:0,
behavior:"smooth"
});

}

function apagar(index){

let lista=JSON.parse(localStorage.getItem("personagens")||"[]");

lista.splice(index,1);

localStorage.setItem("personagens",JSON.stringify(lista));

mostrarSalvos();
}

function gerarAleatorio(){

let nomes=[
"Kael",
"Dante",
"Niko",
"Raven",
"Astra",
"Luan",
"Akira",
"Ren",
"Victor",
"Leon"
];

document.getElementById("nome").value=
nomes[Math.floor(Math.random()*nomes.length)];

document.getElementById("idade").value=
Math.floor(Math.random()*15)+15;

gerar();
}

mostrarSalvos();

</script>

</body>
</html>
```
